#cloud-config
write_files:
  - path: /opt/caribeshop/app.py
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: "${app_py_base64}"

  - path: /etc/systemd/system/caribeshop.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Aplicación CaribeShop
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      DynamicUser=yes
      StateDirectory=caribeshop
      WorkingDirectory=/opt/caribeshop
      Environment=PORT=80
      Environment=HEALTH_FLAG=/var/lib/caribeshop/unhealthy
      Environment="KEY_VAULT_URI=${key_vault_uri}"
      Environment="SECRET_NAME=${secret_name}"
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      NoNewPrivileges=yes
      ExecStart=/usr/bin/python3 /opt/caribeshop/app.py
      Restart=on-failure
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, caribeshop.service]